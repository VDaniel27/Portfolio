<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Victor Ortiz | Software Engineer</title>
    <meta name="description" content="Portafolio de Victor Daniel Ortiz García, Jr. Software Engineer especializado en desarrollo Full-stack, diseño de APIs RESTful y procesamiento de datos. Puebla, México." />
    <meta name="author" content="Victor Daniel Ortiz García" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <base href="/Portfolio/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Portfolio.styles.css" rel="stylesheet" />
</head>

<body>
    <!-- Aplicar tema antes de que Blazor cargue para evitar flash -->
    <script>
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');
    </script>

    <div id="app">
        <div class="splash-screen">
            <div class="splash-waves">
                <div class="wave wave1"></div>
                <div class="wave wave2"></div>
                <div class="wave wave3"></div>
            </div>
            <div class="splash-content">
                <div class="splash-logo">VO</div>
                <div class="splash-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>
    </div>

    <style>
        .splash-screen {
            position: fixed;
            inset: 0;
            background: #0a0f1e;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            overflow: hidden;
        }

        body.light .splash-screen { background: #f0f4ff; }

        .splash-waves {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .wave {
            position: absolute;
            width: 250%;
            height: 250%;
            top: -75%;
            left: -75%;
            border-radius: 43%;
            animation: waveRotate linear infinite;
            opacity: 0.08;
        }

        .wave1 {
            background: radial-gradient(ellipse, #4f8ef7 0%, transparent 70%);
            animation-duration: 8s;
            filter: blur(40px);
        }

        .wave2 {
            background: radial-gradient(ellipse, #7c3aed 0%, transparent 70%);
            animation-duration: 12s;
            animation-direction: reverse;
            filter: blur(60px);
            opacity: 0.06;
        }

        .wave3 {
            background: radial-gradient(ellipse, #4f8ef7 0%, transparent 60%);
            animation-duration: 16s;
            filter: blur(80px);
            opacity: 0.05;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
        }

        @keyframes waveRotate {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .splash-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .splash-logo {
            font-family: 'Inter', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4f8ef7, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: splashPulse 2s ease-in-out infinite;
        }

        @keyframes splashPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.7; transform: scale(0.97); }
        }

        .splash-dots {
            display: flex;
            gap: 0.5rem;
        }

        .splash-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4f8ef7;
            animation: dotBounce 1.2s ease-in-out infinite;
        }

        .splash-dots span:nth-child(2) { animation-delay: 0.2s; background: #6b7ff7; }
        .splash-dots span:nth-child(3) { animation-delay: 0.4s; background: #7c3aed; }

        @keyframes dotBounce {
            0%, 80%, 100% { transform: translateY(0);    opacity: 0.4; }
            40%            { transform: translateY(-10px); opacity: 1; }
        }
    </style>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="js/portfolio.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
